<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yogesh Gupta | Freelance Web Developer</title>
    <script>
      // GitHub Pages SPA redirect
      var segment = 1
      var base = '/comapre-Plugin/'
      var l = window.location
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        base + l.pathname.slice(1).split('/').slice(segment).join('/').replace(/\/+/g, '/').replace(/\/$/, '') +
        l.search + l.hash)
    </script>
  </head>
  <body></body>
</html>
